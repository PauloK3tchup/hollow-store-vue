apiVersion: apps/v1
kind: Deployment
metadata:
  name: hollow-store-vue
  labels:
    app: hollow-store-vue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hollow-store-vue
  template:
    metadata:
      labels:
        app: hollow-store-vue
    spec:
      containers:
        - name: hollow-store-vue
          image: your-registry/hollow-store-vue:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
